name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Format · Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Route types (PageProps / LayoutProps / RouteContext) are generated, not
      # committed, so they must exist before tsc runs.
      - name: Generate route types
        run: npx next typegen

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test

  migrations:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest

    # Plain Postgres, not Supabase. The RLS migration is guarded on the `auth`
    # schema existing, so this proves it applies in both environments — and
    # catches a migration that only works because of Supabase-specific state.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Verify schema is in sync with drizzle/
        # A schema change committed without a generated migration would leave
        # the database and src/db/schema.ts silently diverged.
        run: |
          npx drizzle-kit generate --name ci_drift_check
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::src/db/schema.ts has changes with no migration. Run: npm run db:generate"
            git status --porcelain drizzle/
            exit 1
          fi

  build:
    name: Production build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        # No secrets in CI: env validation is skipped, and the build must not
        # depend on any of them being present.
        env:
          SKIP_ENV_VALIDATION: '1'
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
        run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # Slower than the other jobs because it boots the whole Supabase stack.
    # Worth it: these are the only tests that exercise browser-side CSV
    # parsing, the server actions and the queue together.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Start Supabase
        run: npx supabase start

      - name: Read Supabase credentials
        id: supabase
        run: |
          echo "anon_key=$(npx supabase status -o json | jq -r .ANON_KEY)" >> "$GITHUB_OUTPUT"

      - name: Apply migrations
        env:
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: npm run db:migrate

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.anon_key }}
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          # Deterministic throwaway keys — CI has no real credentials to protect.
          ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          UNSUBSCRIBE_SECRET: ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=
          CRON_SECRET: e2e-cron-secret
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
